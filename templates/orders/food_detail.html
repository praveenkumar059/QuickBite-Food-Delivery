{% extends 'base.html' %}{% load static %}{% block content %}<div class="row g-4"><div class="col-md-6"><img class="img-fluid rounded" src="{% static food.image %}" alt="{{ food.name }} illustration" onerror="this.onerror=null;this.src='{% static 'img/food.svg' %}'"></div><div class="col-md-6 panel"><p class="eyebrow">{{ food.get_category_display }}</p><h1>{{ food.name }}</h1><p>{{ food.description }}</p><p class="price fs-3">₹{{ food.price }}</p>{% if user.is_authenticated %}<form method="post" action="{% url 'add_cart' food.pk %}">{% csrf_token %}<label for="quantity">Quantity (1–20)</label><input id="quantity" type="number" name="quantity" min="1" max="20" value="1" required><button class="btn btn-primary mt-3">Add to cart</button></form>{% else %}<a href="{% url 'login' %}">Login to order</a>{% endif %}</div></div>{% endblock %}
